site_name: VAGEN
site_description: Training VLM Agents with Multi-Turn Reinforcement Learning
site_url: https://vagen.readthedocs.io/
docs_dir: docs

repo_name: mll-lab-nu/VAGEN
repo_url: https://github.com/mll-lab-nu/VAGEN

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mll-lab-nu/VAGEN

nav:
  - Home: index.md
  - Active Spatial: active_spatial.md
  - Active Spatial Full Pipeline:
    - Overview: active_spatial_end_to_end.md
    - Data and Mixed SFT: active_spatial_pipeline_data.md
    - Active Spatial RL: active_spatial_pipeline_rl.md
    - StarVLA and RLinf: active_spatial_pipeline_robot.md
    - Audit and Acceptance: active_spatial_pipeline_audit.md
  - Model Backbones:
    - Integration Guide: model_backbone_integration.md
    - Cambrian-S Smoke: cambrian_s_new_server_smoke_handoff.md
    - Cambrian-S Experiments: cambrian_iteration.md
    - SenseNova-U1: sensenova_u1_active_spatial.md
  - Quick Start: quickstart.md
  - Configuration: configuration.md
  - Customization:
    - Environment: custom-environment.md
    - Filter: custom-filter.md
    - Metric: custom-metric.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
