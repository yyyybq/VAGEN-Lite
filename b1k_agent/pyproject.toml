[project]
name = "b1k_agent"
version = "0.1.0"
description = "Modular strong-model planner + executor agent for the BEHAVIOR-1K 2026 challenge (official evaluator)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.0", "pyyaml>=6.0", "websockets>=13", "msgpack>=1.0", "pillow>=10", "httpx>=0.27"]

[project.optional-dependencies]
claude = ["anthropic"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
