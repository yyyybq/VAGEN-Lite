<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间能力题 · 人工审核</title>
<style>
:root{color-scheme:light;--ink:#17352c;--green:#25634e;--muted:#66756f;--line:#d8e1db}*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font:15px/1.6 system-ui,sans-serif}header{background:#173e32;color:white;padding:24px max(24px,calc((100vw - 1200px)/2));}h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:#dce8df}main{max-width:1248px;margin:auto;padding:22px 24px 80px}.controls,.nav,.meta,.review-buttons{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}button,select,input,textarea{font:inherit;border:1px solid #b5c7bd;border-radius:7px;padding:8px 12px;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:default}label{display:inline-flex;align-items:center;gap:7px}label.stacked{display:flex;align-items:stretch;flex-direction:column}.meta{font-size:13px;color:var(--muted);margin:8px 0 14px}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.image-wrap{position:relative;display:flex;align-items:center;justify-content:center;background:#e9ede7;min-height:260px}.image-wrap img{display:block;max-width:100%;max-height:540px;object-fit:contain}.image-wrap img.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}figure{margin:0}figcaption{font-size:13px;text-align:center;color:var(--muted)}#question{white-space:pre-wrap;font-size:20px;margin:18px 0 12px}.options{list-style:none;padding:0;display:grid;gap:8px}.options li{padding:10px 14px;background:#f6f8f4;border-radius:6px}.answer{font-weight:700;color:#216443}.evidence li{margin:6px 0}details pre{white-space:pre-wrap;word-break:break-word;background:#f7f8f5;padding:12px}textarea{width:100%;min-height:90px}.review-buttons button.active{background:#d9eee3;border-color:#2f7859;box-shadow:inset 0 0 0 1px #2f7859}.tiny{font-size:13px;color:var(--muted)}#notice{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#153e30;color:white;padding:10px 18px;border-radius:8px;max-width:90vw}#notice:empty{display:none}.nav{justify-content:space-between}#source{font-size:12px}a{color:#25634e}[hidden]{display:none!important}@media(max-width:650px){main{padding:15px 12px}.controls,.panel{padding:14px}header{padding:20px}#question{font-size:18px}}
</style></head><body>
<header><h1>空间能力题 · 人工审核</h1><p id="intro"></p></header>
<main><section class="controls">
<label>审阅人<input id="reviewer" placeholder="姓名或标识" autocomplete="name"></label>
<label>能力类别<select id="group"><option value="">全部类别</option></select></label>
<label>审核状态<select id="status"><option value="">全部题目</option><option value="pending">待审</option><option value="correct">答案对</option><option value="incorrect">答案错</option><option value="undecidable">从图里看不出来</option><option value="bad_image">画面质量差</option></select></label>
<label><input id="show-answer" type="checkbox">显示标准答案与依据</label><label><input id="show-boxes" type="checkbox">叠加检查图</label>
<button id="export" class="primary">导出审核结果</button><button id="import">导入审核结果</button><input id="import-file" type="file" accept="application/json" hidden>
</section><div class="nav"><button id="prev">← 上一题</button><strong id="progress"></strong><button id="next">下一题 →</button></div>
<p class="tiny" id="overall"></p><section id="empty" class="panel" hidden>当前筛选没有题目。</section>
<article id="workspace" class="panel"><div id="meta" class="meta"></div><div id="images" class="images"></div><p id="question" lang="en"></p><ol id="options" class="options"></ol>
<section id="answer-panel" hidden><p id="answer" class="answer"></p><h3>计算依据</h3><ul id="evidence" class="evidence"></ul><details><summary>查看原任务与数据来源</summary><pre id="source"></pre></details></section>
<hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>您的结论</h3><p class="tiny">先填写审阅人，再选择结论。备注选填并自动保存；每条非空备注都会进入导出的后续分析清单。标记不会直接放行训练数据。</p>
<div id="review-buttons" class="review-buttons"></div><label class="stacked" style="margin-top:14px">备注（选填）<textarea id="note" placeholder="指出物体、题意、答案或画面问题；即使答案正确，也可以留意见。"></textarea></label>
<p id="saved" class="tiny"></p><button id="reset">恢复待审</button></article>
<footer class="tiny">检查图是把物体的三维框投到图像上的辅助线；它与原图分别保存。模型评测结果单独存放，不参与此页的人工作答，也不作为筛题依据。</footer></main><p id="notice" role="status" aria-live="polite"></p>
<script>
const DATA=/*__CAPABILITY_DATA__*/null;
const $=id=>document.getElementById(id), labels=DATA.review_labels, byId=new Map(DATA.items.map(q=>[q.qid,q]));
const STORE='interiorgs-capability-human-review:'+DATA.manifest_sha256;
let records={},currentId=DATA.items[0].qid,noticeTimer;
try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x){records=validateImport(x);}}catch(e){}
try{$('reviewer').value=localStorage.getItem('interiorgs-capability-reviewer')||'';}catch(e){}
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function pending(){return {status:'pending',reviewer:'',note:'',reviewed_at:null,updated_at:null,note_reviewer:''};}
function record(qid){return records[qid]||pending();}
function bindings(q){return {qid:q.qid,image_sha256:q.image_sha256,question_sha256:q.question_sha256};}
function exportBody(){const rows=DATA.items.map(q=>({...bindings(q),...record(q.qid),reviewer_kind:'human'}));return {schema_version:'interiorgs_capability_human_reviews_v1',manifest_sha256:DATA.manifest_sha256,exported_at:new Date().toISOString(),records:rows,analysis_queue:rows.filter(r=>r.note.trim()).map(r=>({...r,analysis_status:'pending'}))};}
function validateImport(body){if(body.schema_version!=='interiorgs_capability_human_reviews_v1'||body.manifest_sha256!==DATA.manifest_sha256||!Array.isArray(body.records)||body.records.length!==DATA.items.length)throw Error('记录不属于这一批完整题目');const out={};for(const r of body.records){const q=byId.get(r.qid);if(!q||out[r.qid]||r.question_sha256!==q.question_sha256||JSON.stringify(r.image_sha256)!==JSON.stringify(q.image_sha256))throw Error('题号、原图或题目已变化');if(r.reviewer_kind!=='human'||!['pending',...Object.keys(labels)].includes(r.status)||typeof r.note!=='string'||typeof r.reviewer!=='string')throw Error('审核字段无效');if(r.status!=='pending'&&(!r.reviewer.trim()||!r.reviewed_at||!Number.isFinite(Date.parse(r.reviewed_at))))throw Error('结论缺少审阅人或实际保存时间');if(r.note.trim()&&(!String(r.note_reviewer||r.reviewer).trim()||!r.updated_at||!Number.isFinite(Date.parse(r.updated_at))))throw Error('备注缺少作者或保存时间');out[r.qid]={status:r.status,reviewer:r.reviewer,note:r.note,reviewed_at:r.reviewed_at,updated_at:r.updated_at,note_reviewer:r.note_reviewer||r.reviewer||''};}return out;}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(exportBody()));localStorage.setItem('interiorgs-capability-reviewer',$('reviewer').value);}catch(e){notify('浏览器保存失败，请立即导出审核结果。');}}
function notify(text){$('notice').textContent=text;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{$('notice').textContent='';},4500);}
function selected(){return DATA.items.filter(q=>(!$('group').value||q.group===$('group').value)&&(!$('status').value||record(q.qid).status===$('status').value));}
function requireReviewer(){if(!$('reviewer').value.trim()){notify('请先填写审阅人；结论与备注需要保留作者。');$('reviewer').focus();return false;}return true;}
function saveVerdict(status){if(!requireReviewer())return;const now=new Date().toISOString();records[currentId]={...record(currentId),status,reviewer:$('reviewer').value.trim(),reviewed_at:status==='pending'?null:now,updated_at:now};persist();render();}
function saveNote(){if(!requireReviewer())return;records[currentId]={...record(currentId),note:$('note').value,reviewer:record(currentId).status==='pending'?$('reviewer').value.trim():record(currentId).reviewer,note_reviewer:$('reviewer').value.trim(),updated_at:new Date().toISOString()};persist();updateProgress();$('saved').textContent='备注已保存；非空备注已进入后续分析清单。';}
function updateProgress(){const done=DATA.items.filter(q=>record(q.qid).status!=='pending').length,notes=DATA.items.filter(q=>record(q.qid).note.trim()).length;$('overall').textContent=`全部 ${DATA.items.length} 道题中，已记录结论 ${done} 道，待审 ${DATA.items.length-done} 道；有备注等待分析 ${notes} 道。`;}
function render(){const list=selected();if(!list.some(q=>q.qid===currentId))currentId=list[0]?.qid||null;const index=list.findIndex(q=>q.qid===currentId);$('workspace').hidden=!list.length;$('empty').hidden=!!list.length;$('prev').disabled=index<=0;$('next').disabled=index<0||index>=list.length-1;$('progress').textContent=list.length?`当前筛选第 ${index+1} / ${list.length} 道题`:'当前筛选无题';updateProgress();if(!currentId)return;const q=byId.get(currentId),r=record(currentId);$('meta').textContent=`${q.group} · 场景 ${q.scene_id} · 来源任务 ${q.parent_task_id} · 题号 ${q.qid}`;$('question').textContent=q.question;$('options').replaceChildren(...q.options.map((x,i)=>element('li',String.fromCharCode(65+i)+'. '+x)));$('images').replaceChildren(...q.images.map((src,i)=>{const f=element('figure'),wrap=element('div');wrap.className='image-wrap';const im=element('img');im.src=src;im.alt=q.images.length>1?`图 ${i+1}：原始观察`:'原始观察';wrap.append(im);if($('show-boxes').checked&&q.overlays[i]){const overlay=element('img');overlay.className='overlay';overlay.src=q.overlays[i];overlay.alt='仅检查用的投影叠加图';wrap.append(overlay);}f.append(wrap,element('figcaption',q.images.length>1?`图 ${i+1}（顺序与题目一致）`:'环境原始观察'));return f;}));$('answer-panel').hidden=!$('show-answer').checked;$('answer').textContent='标准答案：'+q.answer+' · '+q.options[q.answer.charCodeAt(0)-65];$('evidence').replaceChildren(...q.evidence_zh.map(x=>element('li',x)));$('source').textContent=JSON.stringify({task_type:q.task_type,parent_task_id:q.parent_task_id,scene_id:q.scene_id,source:q.source},null,2);$('review-buttons').replaceChildren(...Object.entries(labels).map(([value,text])=>{const b=element('button',text);b.classList.toggle('active',r.status===value);b.setAttribute('aria-pressed',String(r.status===value));b.onclick=()=>saveVerdict(value);return b;}));$('note').value=r.note;$('note').disabled=!$('reviewer').value.trim();$('saved').textContent=r.reviewed_at?`结论已保存：${r.reviewer} · ${r.reviewed_at}`:r.note.trim()?`备注已保存，结论仍待审：${r.reviewer}`:'尚未记录人工结论。';}
function move(delta){const list=selected(),index=list.findIndex(q=>q.qid===currentId);if(list[index+delta]){currentId=list[index+delta].qid;render();}}
for(const group of [...new Set(DATA.items.map(q=>q.group))]){const o=element('option',group);o.value=group;$('group').append(o);}
$('intro').textContent=`本批 ${DATA.items.length} 道真实样题等待您检查。先看原图与英文题目，需要时展开标准答案和中文依据。`;
for(const id of ['group','status','show-answer','show-boxes'])$(id).onchange=render;
$('reviewer').oninput=()=>{try{localStorage.setItem('interiorgs-capability-reviewer',$('reviewer').value);}catch(e){}$('note').disabled=!$('reviewer').value.trim();};
$('note').oninput=saveNote;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('reset').onclick=()=>saveVerdict('pending');
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(exportBody(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=element('a');a.href=url;a.download='capability-human-reviews-'+DATA.manifest_sha256.slice(0,12)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async()=>{const f=$('import-file').files[0];if(!f)return;try{const imported=validateImport(JSON.parse(await f.text()));records=imported;persist();render();notify('审核结果已导入，题目与图片一致。');}catch(e){notify('导入失败：'+e.message);}finally{$('import-file').value='';}};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
window.CAPABILITY_REVIEW_API={data:DATA,exportBody,validateImport,selected,current:()=>byId.get(currentId),saveVerdict,saveNote};render();
</script></body></html>
