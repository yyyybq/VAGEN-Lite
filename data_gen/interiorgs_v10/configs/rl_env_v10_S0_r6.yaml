# RL env for InteriorGS v10 as trained and evaluated in rounds 6-9 (2026-10-14), kept for reproducing those runs
# (round 10 changed the default rules in rl_env_v10_S0.yaml).  The dense-score pilot's S0 branch (sparse reward; the most stable
# endpoint of exps/.../dense_score_reward_only_pilot_parallel_r3_20261009) with two changes:
#   prompt_format: no_think   -- the v10 SFT data is action-only (configs/admission_v2.json sft.export), and
#                                RL starts from that SFT model, so both show the same prompt;
#   r1_legacy_success: false  -- the env's v10 success rules (target_visibility.py), not R1's.
# training_prep.py rl-config fills jsonl_path, gs_root, train_size, n_envs and the seeds per split.
envs:
- name: ActiveSpatial
  data_source: active_spatial
  max_turns: 12
  response_length_per_turn: 384
  config:
    action_space: strafe
    client_url: ${oc.env:R1_RENDER_URL}
    enable_auto_termination: true
    enable_distance_in_obs: false
    enable_explicit_done: false
    enable_near_success_reward: false
    enable_potential_field: true
    enable_potential_shaping_reward: false
    enable_visibility_shaping_reward: false
    format_reward: 0.0
    gpu_device: 0
    image_height: 256
    image_width: 256
    invalid_format_penalty: -0.1
    max_actions_per_step: 5
    max_episode_steps: 12
    near_success_bonus: 0.0
    near_success_threshold: 0.55
    potential_field_gamma: 0.95
    potential_field_orientation_weight: 0.3
    potential_field_position_weight: 0.7
    potential_field_progress_mode: potential
    potential_field_reward_scale: 1.0
    prompt_format: no_think
    r1_legacy_success: false
    render_backend: http
    render_fail_fast: true
    step_rotation_deg: 20.0
    step_translation: 0.3
    success_reward: 5.0
    success_score_threshold: 0.65
    test_size: 0
    turn_budget: 12
