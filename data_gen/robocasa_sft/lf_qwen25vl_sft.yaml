# LLaMA-Factory SFT config — Qwen2.5-VL (or Active Spatial HF actor) on RoboCasa
#
# model_name_or_path is a placeholder. run_sft.sh overrides it with --model-path
# so the same recipe works for:
#   * original VLM weights (e.g. Qwen2.5-VL-3B-Instruct)
#   * Active Spatial trained HF actor dirs (config.json + safetensors + tokenizer)
#
# Usage:
#   llamafactory-cli train data_gen/robocasa_sft/lf_qwen25vl_sft.yaml \
#       model_name_or_path=/path/to/model \
#       dataset_dir=/path/to/lf_data \
#       output_dir=/path/to/out

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
deepspeed: null   # use FSDP via accelerate config instead

### dataset
dataset: robocasa_sft           # name in dataset_info.json
template: qwen2_vl              # LLaMA-Factory Qwen2-VL template (also used for 2.5-VL)
cutoff_len: 8192
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: ./checkpoints/robocasa_sft
logging_steps: 5
save_steps: 200
save_strategy: steps
save_total_limit: 4
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true
flash_attn: fa2

### eval
val_size: 0.02
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
