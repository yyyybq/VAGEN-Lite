# G-oracle of matrix v3 (the user's instruction of 2026-11-07, item 6c; configs/matrix_v3/Go.yaml): recipe Go = D's recipe
# (P0 + P1 + the action trajectories) + the pointing pool Pg, with every action-trajectory frame replaced by the frame with
# the task's targets' truth boxes drawn in (P2m: D's P2q, the same 9,075 train and 300 validation trajectories, the text
# byte for byte, data_gen/sft_mixture/marker_convert.py).  P0 and P1 are drawn as D (draw_as D: the same rows); Pg is
# G's pool (the same 9,075 questions, 0-1000 coordinates); everything else is mixture_matrix_v3_qwen3_g_norm1000_20261106.yaml.
name: matrix_v3_qwen3_go_20261107
out: exps/matrix_v3/sft_mixture_go_20261107
seed: 20261018
split_manifest: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r11_20261016/sft/split_manifest.json
task_rows: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r11_20261016/sft/rows.jsonl
exclude_scenes: configs/scene_screen/scene_exclusions_20261029.json
base_recipe: /mnt/umm/users/yinbaiqiao/models_runs/chains/m_qwen3vl8b_formal_sft_20261026/lf_q3formal/train.yaml
train_overrides:
  num_train_epochs: 10
pools:
  P0:
    kind: interiorgs_qa_lf
    dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/interiorgs_qa_final_20261028/lf_256   # train 785 scenes, val 99
    train: qa_train.jsonl
    val: qa_val.jsonl
    exclude_groups: [S7]
  P1:   # the bank lives in the transition-qa worktree
    kind: transition_qa
    train: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/transition_qa_20261019b/p1_train.jsonl
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/transition_qa_20261019b/p1_test.jsonl
  P2q:   # validation rows only (D's validation loss, unmarked frames)
    kind: sft_trajectories
    train: /mnt/umm/users/yinbaiqiao/models_runs/chains/m_qwen3vl8b_formal_sft_20261026/lf_q3formal/trajectory_train.jsonl
    val: /mnt/umm/users/yinbaiqiao/models_runs/chains/m_qwen3vl8b_formal_sft_20261026/lf_q3formal/trajectory_val.jsonl
    format_example: action_names
  P2f:   # validation rows only
    kind: sft_trajectories
    train: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_train_r12o_20261023/lf_format/trajectory_train.jsonl
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_train_r12o_20261023/lf_format/trajectory_val.jsonl
    format_example: action_names
  P2m:   # D's P2q with the truth boxes drawn into every frame (the text unchanged)
    kind: sft_trajectories
    train: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/go_prep_20261107/p2m/P2m_train.jsonl
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/go_prep_20261107/p2m/P2m_val.jsonl
    format_example: action_names
  Pg:   # G's pointing questions (train scenes; validation: the test file of the validation scenes)
    kind: transition_qa
    train: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/g_prep_20261106/pg/targets_norm1000/pg_train.jsonl
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/g_prep_20261106/pg/targets_norm1000/pg_test.jsonl
val:
  P0: 300
  P1: 300
  P2q: 300
  P2f: all
  P2m: all
  Pg: 300
recipes:
  Go:
    description: G-oracle（指认作中间表示）：P0 + 转移题 + 画了真值框的动作轨迹 + 指认题
    output_format: action_only
    draw_as: D   # P0 and P1: D's rows
    pools: {P0: all, P1: 9075, P2m: all, Pg: 9075}
