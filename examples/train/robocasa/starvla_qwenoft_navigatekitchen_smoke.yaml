run_id: starvla_qwenoft_nk_smoke
run_root_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/playground/Checkpoints/starvla_nk_smoke
seed: 42
wandb_entity: local
wandb_project: starVLA_robocasa365
is_debug: false
version_id: "0.21"

# Local smoke: Qwen2.5-VL-3B already on disk. flash_attn in vagen-lite is a
# namespace stub, so use sdpa. action_dim=12 is PandaOmron gym concat order.
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /mnt/umm/users/yinbaiqiao/.cache/huggingface/hub/models--Qwen--Qwen2.5-VL-3B-Instruct/snapshots/66285546d2b821cf421d4f5eb2576359d3770cd3
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 12
    state_dim: 16
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/playground/Datasets/robocasa365
    data_mix: robocasa365_navigate_kitchen_pretrain_human
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: decord

trainer:
  max_train_steps: 2
  num_warmup_steps: 0
  save_interval: 2
  eval_interval: 1000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
