# Tiny 1-GPU SFT smoke for RoboCasa (zoetrope).
# Not a full recipe: 4 optimizer steps, no eval, short cutoff.

### model
model_name_or_path: /mnt/umm/users/yinbaiqiao/.cache/huggingface/hub/models--Qwen--Qwen2.5-VL-3B-Instruct/snapshots/66285546d2b821cf421d4f5eb2576359d3770cd3
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false

### dataset
dataset: robocasa_sft
template: qwen2_vl
cutoff_len: 2048
max_samples: 16
overwrite_cache: true
preprocessing_num_workers: 2
dataloader_num_workers: 0

### output
output_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/outputs/robocasa_sft_smoke
logging_steps: 1
save_steps: 4
save_strategy: steps
save_total_limit: 1
plot_loss: false
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 1
max_steps: 4
lr_scheduler_type: cosine
warmup_ratio: 0.0
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
flash_attn: auto

### eval
val_size: 0
eval_strategy: "no"
