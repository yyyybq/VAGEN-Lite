name: active_spatial_h800_7b_unified_v1
defaults:
  max_steps_per_episode: 12
  num_eval_episodes: null
  use_wandb: false
  save_trajectories: true
  task_types:
  - absolute_positioning
  - equidistance
  - projective_relations
  - centering
  - occlusion_alignment
  - fov_inclusion
  - size_distance_invariance
  - apparent_size_ordering
  - screen_occupancy
  env:
    render_backend: local
    gs_root: /mnt/umm/users/yinbaiqiao/InteriorGS
    gpu_device: 0
    image_width: 256
    image_height: 256
    success_score_threshold: 0.65
    step_translation: 0.3
    step_rotation_deg: 20.0
    history_window_size: 1
    action_space: strafe
    enable_explicit_done: false
    max_actions_per_step: 5
    exclude_task_types:
    - delta_control
  model:
    provider: vllm
    model_name: Qwen/Qwen2.5-VL-7B-Instruct
    temperature: 0.1
    top_p: 0.95
    max_tokens: 160
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.7
suites:
- name: id_test
  description: Canonical in-domain held-out active-spatial test split, delta_control
    excluded by defaults.
  jsonl_path: data_gen/active_spatial_pipeline/ood_splits_v2/id_test.jsonl
- name: ood_v2_centering
  description: Existing small OOD split used by V46/V50 online validation.
  jsonl_path: data_gen/active_spatial_pipeline/output_v2/val_ood_v2_centering.jsonl
- name: ood_scene
  description: Generated OOD scene/layout split.
  jsonl_path: data_gen/active_spatial_pipeline/ood_splits_v2/ood_scene.jsonl
- name: ood_instance
  description: 'Generated OOD instance split: seen atomic categories, new instances within training scenes.'
  jsonl_path: data_gen/active_spatial_pipeline/ood_splits_v2/ood_instance.jsonl
- name: ood_category
  description: Generated OOD category/object-label split.
  jsonl_path: data_gen/active_spatial_pipeline/ood_splits_v2/ood_category.jsonl
- name: ood_template
  description: Generated OOD instruction-template paraphrase split.
  jsonl_path: data_gen/active_spatial_pipeline/ood_splits_v2/ood_template.jsonl
- name: ood_geometry
  description: Generated OOD geometry/distance split.
  jsonl_path: data_gen/active_spatial_pipeline/ood_splits_v2/ood_geometry.jsonl
- name: smoke
  description: Three-episode smoke slice from ID test.
  jsonl_path: data_gen/active_spatial_pipeline/ood_splits_v2/id_test.jsonl
  max_episodes: 3
  save_trajectories: false
