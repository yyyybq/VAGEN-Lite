name: sapave_active_eval_v1

# SaPaVe evaluation matrix on InteriorGS.
# Paper: arXiv:2603.12193 / https://lmzpai.github.io/SaPaVe/
#
# ActiveViewPose protocol (Sec. 4.1 Table 1):
#   Val, Test1 (explicit positional language), Test2 (inferred camera motion)
# ActiveManip-Bench protocol (Sec. 4.3 Table 2):
#   Unoccluded / Occluded / Out-of-View x Pick-and-Place / Articulated
#
# Official Isaac Sim ActiveManip-Bench is not released. These suites are the
# camera-control analogue using the same visibility x family grid.

defaults:
  max_steps_per_episode: 20
  num_eval_episodes: null
  use_wandb: false
  save_trajectories: true
  env:
    render_backend: local
    gs_root: /mnt/umm/users/yinbaiqiao/InteriorGS
    gpu_device: 4
    image_width: 256
    image_height: 256
    success_score_threshold: 0.65
    exclude_task_types:
      - delta_control
  model:
    provider: vllm
    model_name: Qwen/Qwen2.5-VL-3B-Instruct
    temperature: 0.1
    top_p: 0.95
    max_tokens: 512
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.8

suites:
  - name: avp_val
    description: ActiveViewPose scene-held-out validation (mixed modalities).
    jsonl_path: data_gen/sapave/output/activeviewpose_val.jsonl

  - name: avp_test1
    description: ActiveViewPose Test1 — explicit positional indicators (left/right/behind).
    jsonl_path: data_gen/sapave/output/activeviewpose_test1.jsonl

  - name: avp_test2
    description: ActiveViewPose Test2 — no explicit camera motion; infer from semantics.
    jsonl_path: data_gen/sapave/output/activeviewpose_test2.jsonl

  - name: am_unoccluded_pap
    description: ActiveManip analogue — unoccluded pick-and-place.
    jsonl_path: data_gen/sapave/output/activemanip_unoccluded_pick_and_place.jsonl

  - name: am_occluded_pap
    description: ActiveManip analogue — occluded pick-and-place.
    jsonl_path: data_gen/sapave/output/activemanip_occluded_pick_and_place.jsonl

  - name: am_out_of_view_pap
    description: ActiveManip analogue — out-of-view pick-and-place.
    jsonl_path: data_gen/sapave/output/activemanip_out_of_view_pick_and_place.jsonl

  - name: am_unoccluded_am
    description: ActiveManip analogue — unoccluded articulated (cabinet/wardrobe/door).
    jsonl_path: data_gen/sapave/output/activemanip_unoccluded_articulated.jsonl

  - name: am_occluded_am
    description: ActiveManip analogue — occluded articulated.
    jsonl_path: data_gen/sapave/output/activemanip_occluded_articulated.jsonl

  - name: am_out_of_view_am
    description: ActiveManip analogue — out-of-view articulated.
    jsonl_path: data_gen/sapave/output/activemanip_out_of_view_articulated.jsonl

  - name: smoke
    description: Tiny smoke suite over ActiveViewPose Test1.
    jsonl_path: data_gen/sapave/output/activeviewpose_test1.jsonl
    max_episodes: 3
    save_trajectories: false
