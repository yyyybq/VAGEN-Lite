defaults:
  - ../../../vagen/configs/eval_default

# Before running eval, start the RoboCasa server in the policy venv:
#   bash examples/evaluate/robocasa/run_server.sh
#
# To expand beyond the smoke task, duplicate the env entry (or use
# scripts/robocasa_eval.py --task_set atomic_seen) for every name in
# ATOMIC_SEEN / COMPOSITE_SEEN.

fileroot: ${oc.env:HOME}/projects/vagen

envs:
  - name: RemoteEnv
    n_envs: 4
    tag_id: robocasa_pickplace_counter_to_cabinet
    seed: [0, 4, 1]
    max_turns: 64
    concat_multi_turn: false
    config:
      base_urls: "http://localhost:8010"
      timeout: 180
      retries: 4
      env_id: PickPlaceCounterToCabinet
      split: target
      prompt_format: free_think
      action_horizon: 8
      max_actions_per_step: 8
      max_steps: 400
      include_wrist_image: false
      render_mode: vision
      format_reward: 0.1
      success_reward: 10.0
    chat_config:
      temperature: 0
      max_tokens: 1024
      top_p: 1.0

experiment:
  dump_dir: ${fileroot}/rollouts/eval_robocasa
  default_max_turns: 64

run:
  backend: "openai"
  base_seed: 0
  max_concurrent_jobs: 4
  resume: skip_completed
  live_summary: true

backends:
  openai:
    api_key: ""               # or export OPENAI_API_KEY
    base_url: null
    model: "gpt-4.1-mini"
    max_concurrency: 4
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0
