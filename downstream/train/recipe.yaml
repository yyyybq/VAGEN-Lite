# Shared StarVLA recipe of every downstream experiment.  make_experiment.py fills only: run paths, seed,
# framework.qwenvl.base_vlm (the start), datasets.vla_data.{data_root_dir, mixture_spec}, trainer.{max_train_steps,
# save_interval, logging_frequency}.  Values are StarVLA's RoboCasa365 QwenOFT defaults
# (third_party/starVLA/examples/simBenchmarks/Robocasa_365/train_files/starvla_qwenoft_robocasa365.yaml, with the
# per-GPU batch 8 of run_robocasa365_all.sh), except: drop_incomplete_action_chunks true (no padded action chunks
# at episode ends, as in scripts/prepare_starvla_transfer.py) and wandb off.
seed: null
wandb_entity: local
wandb_project: downstream
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: null
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: MLP
    action_dim: 12
    state_dim: 16
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: null
    data_mix: robocasa365_downstream
    mixture_spec: null
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    drop_incomplete_action_chunks: true
    num_workers: 4

trainer:
  max_train_steps: null
  num_warmup_steps: 10
  save_interval: null
  eval_interval: 2000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
