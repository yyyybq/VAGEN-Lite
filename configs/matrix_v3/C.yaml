# 矩阵第三版（Qwen3-VL-8B）C 组：P0 + P2q；之后 RL。说明见 configs/matrix_v3/README.md。
# 用户 2026-10-30 选 (a)：按主线 10-27 的登记分两步做。这一步是 SFT 数据和组的定义；RL 和训练链的部分等 qwen3-main 合进 main。
group: C
status: planned
description: P0 + 动作轨迹（新格式）；之后 RL
model_type: qwen3_vl
format_example: action_names
output_format: action_only

data:
  mixture_config: data_gen/sft_mixture/configs/mixture_matrix_v3_qwen3_20261030.yaml
  recipe: C
  lf_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/sft_mixture_matrix_v3_qwen3_20261030/C
  train_rows: {P0: 164, P1: 0, P2q: 9075}
  val_rows: {P0: 17, P1: 300, P2q: 300, P2f: 38}

sft:
  base_model: /mnt/umm/shared_model/huggingface/hub/models--Qwen--Qwen3-VL-8B-Instruct/snapshots/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  epochs: 10
  cards: 8
  recipe: 主线 Qwen3 SFT 的配方（lf_q3formal/train.yaml：模板 qwen3_vl_nothink，学习率 1e-5 余弦，warmup 3%，每步 64 条，冻结视觉塔）
  select: 每个 epoch 在 val（eval_val_v2_screened，382 道）上评测（不采样），挑成功率最高的，打平取更早的

rl:
  start: SFT 挑出的检查点
  pair: {s0: v10_p1_S0, d: v10_p1_Dcond}
  dense: {variant: V4, progress_reward_scale: 3.3333333333333335, group_filter: keep_by_return_std, keep_std_threshold: 0.3318, keep_std_floor: 1.0}
  seeds: [20261019, 20261021]
  task_pool: reserve
  rows: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/rl_rows/rows.jsonl
  exclude: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r10_20261015/depth_check/depth_check_summary.json
  updates: 300
  output_format: action_only
  guards: {invalid_max: 0.10, kl_max: 1.0}
  attention: eager

eval:
  sets:
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_val_v2_screened
    test: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_test_v2_screened
  every: 50
  diagnostics:
    failure_breakdown: python -m eval.diagnostics.failure_breakdown --eval <set> --out <TR>/diag/failure_<set>
    qa_probe: P1 探针（838 道），SFT 各 epoch 和每个 RL 的各检查点；Qwen3 的模型要用 Qwen3 的运行时，等 qwen3-main

chain:   # 用户 2026-11-01 决定 B：在集成分支 matrix-v3 上先跑（不等 qwen3-main 进 main）
  plan: matrix_plan v3   # python -m data_gen.sft_mixture.matrix_plan --version 3 --group C --commit SHA --out '{tr}/plan.json'
  tr: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/m3_c            # 每个种子一条链：<tr>_s<种子>；第一个种子的链训 SFT，第二个从它挑出的检查点起步
  rl_name: v10_rl_m3_c     # 加 _s1 / _s2；RL 运行 m3cs1s0、m3cs1d、m3cs2s0、m3cs2d
  sft_dir: /mnt/umm/users/yinbaiqiao/models_runs/sft_v10_newformat_20261024
  sft_groups: {m3c: sft_trajectories.jsonl}   # SFT 的结果名 sft_m3c_e<k>
  sft_lf_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/sft/C   # data.lf_dir 的复制（数据文件逐字节相同，train.yaml 只改了两条路径）
  needs_chain_support:
    sft_lf_dirs: {m3c: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/sft/C}
    diagnostics_after_eval: true

estimate: {sft: 8 卡约 2.5 小时（10 个 epoch，9,239 条）, rl: 4 个，每个 1 + 8 卡约 5.5 小时, evaluate: 4 个 RL 各 6 个检查点 × 2 个题集}
