# 矩阵第三版（Qwen3-VL-8B）所有组共用的设置。各组 YAML 照抄这些值，data_gen/sft_mixture/tests/test_matrix_v3.py
# 核对它们和这里一致、和主线 10-27 的登记（configs/matrix_r12.json，qwen3-main d530b546）一致。
registration: configs/matrix_r12.json @ qwen3-main d530b546（用户第十四次补充第 5 节，决定 78–80，2026-10-27；A、B′ 是决定 74、75，2026-10-26）
model_type: qwen3_vl
base_qwen3: /mnt/umm/shared_model/huggingface/hub/models--Qwen--Qwen3-VL-8B-Instruct/snapshots/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
format_example: action_names
mixture_config: data_gen/sft_mixture/configs/mixture_matrix_v3_qwen3_20261030.yaml
mixture_out: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/sft_mixture_matrix_v3_qwen3_20261030
sft_recipe: /mnt/umm/users/yinbaiqiao/models_runs/chains/m_qwen3vl8b_formal_sft_20261026/lf_q3formal/train.yaml
rl:
  pair: {s0: v10_p1_S0, d: v10_p1_Dcond}
  dense:   # 决定 79：密集一侧暂用 V4（D_cond 标准，进度奖励 ÷ 3，加补题）；DCK 也跑，三项检查之后再定基线
    variant: V4
    progress_reward_scale: 3.3333333333333335
    group_filter: keep_by_return_std
    keep_std_threshold: 0.3318
    keep_std_floor: 1.0
  seeds: [20261019, 20261021]   # 决定 80：组间差别只按种子配对算，不到两个种子算"未确认"
  task_pool: reserve
  rows: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/rl_rows/rows.jsonl   # 第十一轮的 RL 行去掉 128 个边缘场景（2026-10-29）
  exclude: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r10_20261015/depth_check/depth_check_summary.json
  updates: 300
  guards: {invalid_max: 0.10, kl_max: 1.0}   # 决定 78 的标准停止线；其余照标准配置的训练链默认值（chain_defaults）
  attention: eager                            # 决定 78
eval:
  val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_val_v2_screened    # 382 道
  test: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_test_v2_screened  # 292 道
  every: 50
# 训练链部分到时要用的：rl-config 拿它核对 RL 题和 SFT 题不重合、格式行一致（P2q 的对话，新格式）
format_check_sft_dir: /mnt/umm/users/yinbaiqiao/models_runs/sft_v10_newformat_20261024
# 探针集（补丁 0002 的 diagnostics 步）
p1_probe: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/transition_qa_20261019b/p1_probe.jsonl
p0_probe: null
# 训练链（matrix_plan --version 3 生成 plan 用；用户 2026-11-01 决定 B：集成分支 matrix-v3，工作树 VAGEN-Lite-matrix）
chain:
  worktree: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix   # 训练链和它的任务都从这里跑（VAGEN_LITE_WORKTREE），输出也只写在这里
  eval_sets:   # 上面 eval 的两个题集复制到 matrix 工作树（tasks.jsonl 逐字节相同），评测结果写在这里
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/eval_val_v2_screened
    test: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/eval_test_v2_screened
  job_prefix: m3
  gs_root: /mnt/umm/users/yinbaiqiao/InteriorGS_ply
  scenes_root: /mnt/umm/users/yinbaiqiao/InteriorGS_meta
  pool: queue              # 主线的暂停文件在时不交（模型线的做法），不插队；bq_tp_mmxbf16、bq-ready-* 不碰（决定 52）
  retries: 8               # 主线 10-31 起的做法（PD5 同）
  suspended_grace_min: 10
  max_eval_jobs: 6
  retain: best_and_last    # 评测和诊断之后只留每个 RL 最好的和最后的检查点、挑出的 SFT epoch
  rl:                      # 主线当前 Qwen3 链的提交方式（PD5，2026-11-01）
    renderer_workers: 32
    renderer_first: false
    renderer_repack: true
    renderer_after_trainer: {trainer_wait_s: 43200}
  trainer_attn: eager      # 决定 78；Qwen3 运行时没有 flash-attn，不写也是 eager，这里写明
  dense_baseline: null     # 密集一侧的基线等用户转达主线的答复再填（2026-11-01）；null 时是占位，训练链停在 RL 配置
