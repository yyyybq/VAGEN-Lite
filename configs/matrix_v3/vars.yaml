registration: configs/matrix_r12.json @ qwen3-main d530b546（用户第十四次补充第 5 节，决定 78–80，2026-10-27；A、B′ 是决定 74、75，2026-10-26）
model_type: qwen3_vl
base_qwen3: /mnt/umm/shared_model/huggingface/hub/models--Qwen--Qwen3-VL-8B-Instruct/snapshots/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
format_example: action_names
