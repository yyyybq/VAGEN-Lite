# 矩阵第三版（Qwen3-VL-8B）B′ 组：P0 + P2f（格式 SFT 的短对话）；之后 RL。说明见 configs/matrix_v3/README.md。
# 主线决定 75（2026-10-26）：原来的 B 只用 P0 做 SFT，起点没见过动作回答，和关闭的 A 组一样会在 RL 里丢格式，
# 所以加上 P2f；P2f 先全用，格式不稳再加。
# P2f 的 440 条里 400 条来自 train 场景、40 条来自 val 场景：按场景划分只有前者能进训练，再去掉边缘场景里的 34 条，
# 训练用 366 条；val 场景的 38 条（去掉边缘场景后）作验证损失，每组都算。
# 用户 2026-11-03 改定（矩阵第三版之后的格子，探索性；预登记"矩阵第三版之后加的"第 6、7 条）：P2f 换成主线的 2,000 段格式对话，
# 去掉边缘场景后 1,795 条（P2f2k，主线的 format_sft_2k_screened）；只训 SFT，每个 epoch 评验证集、测试集并做采样验收，
# 有 epoch 过验收线才从挑出的 epoch 跑一对 S0 / V4（只用种子 20261019），没有就不跑 RL。
group: B
name: B′
status: planned   # 探索性（用户 2026-11-03：矩阵第三版之后的格子）
description: B′：P0 加主线的格式对话（去掉边缘场景后 1,795 条；用户 2026-11-03，探索性）；只训 SFT，有 epoch 过采样验收才跑一对 RL
model_type: qwen3_vl
format_example: action_names
output_format: action_only
changed: 2026-10-26 主线决定 75：原来只用 P0；P0 的起点没见过动作回答，加 P2f，条数按格式是否稳定来定（先全用）

data:   # 2026-11-03 起（之前：mixture_matrix_v3_qwen3_20261102.yaml 的 B，P0 10,144 + P2f 366，没有训练过）
  mixture_config: data_gen/sft_mixture/configs/mixture_matrix_v3_qwen3_bp_20261103.yaml
  recipe: B
  lf_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/sft_mixture_bp_20261103/B
  train_rows: {P0: 10144, P1: 0, P2q: 0, P2f: 0, P2f2k: 1795}
  val_rows: {P0: 300, P1: 300, P2q: 300, P2f: 38}

sft:
  base_model: /mnt/umm/shared_model/huggingface/hub/models--Qwen--Qwen3-VL-8B-Instruct/snapshots/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  epochs: 10
  cards: 8
  recipe: 主线 Qwen3 SFT 的配方（lf_q3formal/train.yaml：模板 qwen3_vl_nothink，学习率 1e-5 余弦，warmup 3%，每步 64 条，冻结视觉塔）
  select: 先过采样验收（后备题 200 道 × 4 次、温度 0.8；熵 ≤ 0.06、读不出 ≤ 1%），合格的 epoch 里按 val（eval_val_v2_screened，382 道，不采样）挑成功率最高的，打平取更早的；一个都不合格就不跑 RL（预登记第 6、7 条，用户 2026-11-03）
  format_stability: P2f 先全用（366 条）；B′ 任何一个 RL 被 10% 线停下就算格式不稳（用户 2026-10-30 定），加多少 P2f、重训 B′ 的 SFT 由用户定

rl:
  start: SFT 挑出的检查点
  pair: {s0: v10_p1_S0, d: v10_p1_Dcond}
  dense: {variant: V4, progress_reward_scale: 3.3333333333333335, group_filter: keep_by_return_std, keep_std_threshold: 0.3318, keep_std_floor: 1.0}
  seeds: [20261019, 20261021]
  task_pool: reserve
  rows: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/rl_rows/rows.jsonl
  exclude: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r10_20261015/depth_check/depth_check_summary.json
  updates: 300
  output_format: action_only
  guards: {invalid_max: 0.10, kl_max: 1.0, entropy_max: 0.3, entropy_window: 5, vision_token_crashes: 2}
  attention: eager
  risk: >-
    B′ 只有 366 条短的动作对话（每条一到两个助手回合），动作格式可能学得浅。从格式 SFT 起步的 RL 都没稳住：
    Qwen2.5 上（格式 SFT v1、v2 和稳定性对照共 13 个 RL，其中 10 个的起点用的就是 P2f 这批对话）都在第 10 到 55 次更新之间
    被 10% 线停下；Qwen3 上（主线 REPORT_QWEN3_DENSE_20261028：同一批对话的格式 SFT 第 1 个 epoch，采样熵 0.157）
    S0、V4 两臂都在第 60 到 90 次更新走样。
    B′ 多了 P0、训练 10 个 epoch，起点不同，但格式可能同样不稳；不稳时按决定 75 加 P2f 的条数。

eval:
  sets:
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_val_v2_screened
    test: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_test_v2_screened
  every: 50
  diagnostics:
    failure_breakdown: python -m eval.diagnostics.failure_breakdown --eval <set> --out <TR>/diag/failure_<set>
    qa_probe: P1 探针（838 道），SFT 各 epoch 和每个 RL 的各检查点；Qwen3 的模型要用 Qwen3 的运行时，等 qwen3-main

chain:   # 用户 2026-11-03：矩阵第三版之后的格子，在 matrix-v3 上跑
  plan: matrix_plan v3 cell   # --sft-chain 写只训 SFT 的链（<tr>_sft，每个 epoch 都留）；有 epoch 过验收时 --start 写种子 20261019 的 RL 链
  tr: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/m3_b   # 每条链在自己的文件夹里另有两个题集的复制
  rl_name: v10_rl_m3_b     # 加 _sft / _s1；RL 运行 m3bs1s0、m3bs1d
  sft_dir: /mnt/umm/users/yinbaiqiao/models_runs/sft_v10_newformat_20261024
  sft_groups: {m3b: sft_trajectories.jsonl}   # SFT 的结果名 sft_m3b_e<k>
  sft_lf_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/sft/B   # data.lf_dir 的复制（数据文件逐字节相同，train.yaml 只改了两条路径）
  needs_chain_support:
    sft_lf_dirs: {m3b: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/sft/B}
    diagnostics_after_eval: true

estimate: {sft: 8 卡约 2.3 小时（10 个 epoch，11,939 条）, accept: 10 个 epoch 各一个单卡任务约 40 分钟, rl: 只在有 epoch 过验收时跑一对（种子 20261019）, 合计: 约 25 卡时不含 RL（用户 2026-11-03 的估计）}
