# 矩阵第三版（Qwen3-VL-8B）D_noP0 组：D 去掉 P0，P1 和 P2q 的行和 D 逐条相同。说明见 configs/matrix_v3/README.md。
# 用户 2026-11-03 排期（矩阵第三版之后的新格子，探索性；预登记"矩阵第三版之后加的"第 6、7 条）：把 D 的稳定和成绩分成 P0 的功劳和 P1 的功劳。
group: D_noP0
status: planned   # 探索性（用户 2026-11-03）；之前是备选、不排期（用户 2026-10-19，第二版起）
description: 转移题 + 动作轨迹（新格式），不含 P0（探索性，2026-11-03 排期）
model_type: qwen3_vl
format_example: action_names
output_format: action_only

data:
  mixture_config: data_gen/sft_mixture/configs/mixture_matrix_v3_qwen3_20261102.yaml
  recipe: D_noP0
  lf_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/sft_mixture_matrix_v3_qwen3_20261102/D_noP0
  train_rows: {P0: 0, P1: 9075, P2q: 9075}
  val_rows: {P0: 300, P1: 300, P2q: 300, P2f: 38}

sft:
  base_model: /mnt/umm/shared_model/huggingface/hub/models--Qwen--Qwen3-VL-8B-Instruct/snapshots/0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
  epochs: 10
  cards: 8
  recipe: 主线 Qwen3 SFT 的配方（lf_q3formal/train.yaml：模板 qwen3_vl_nothink，学习率 1e-5 余弦，warmup 3%，每步 64 条，冻结视觉塔）
  select: 先过采样验收（后备题 200 道 × 4 次、温度 0.8；熵 ≤ 0.06、读不出 ≤ 1%），合格的 epoch 里按 val（eval_val_v2_screened，382 道，不采样）挑成功率最高的，打平取更早的；一个都不合格就不跑 RL（预登记第 6 条，用户 2026-11-03）

rl:
  start: SFT 挑出的检查点
  pair: {s0: v10_p1_S0, d: v10_p1_Dcond}
  dense: {variant: V4, progress_reward_scale: 3.3333333333333335, group_filter: keep_by_return_std, keep_std_threshold: 0.3318, keep_std_floor: 1.0}
  seeds: [20261019, 20261021]
  task_pool: reserve
  rows: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/rl_rows/rows.jsonl
  exclude: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r10_20261015/depth_check/depth_check_summary.json
  updates: 300
  output_format: action_only
  guards: {invalid_max: 0.10, kl_max: 1.0, entropy_max: 0.3, entropy_window: 5, vision_token_crashes: 2}
  attention: eager

eval:
  sets:
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_val_v2_screened
    test: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/matrix_inputs_20261029/eval_test_v2_screened
  every: 50
  diagnostics:
    failure_breakdown: python -m eval.diagnostics.failure_breakdown --eval <set> --out <TR>/diag/failure_<set>
    qa_probe: P1 探针（838 道），SFT 各 epoch 和每个 RL 的各检查点；Qwen3 的模型要用 Qwen3 的运行时，等 qwen3-main

chain:   # 用户 2026-11-03：矩阵第三版之后的格子，在 matrix-v3 上跑
  plan: matrix_plan v3 cell   # --sft-chain 写只训 SFT 的链（<tr>_sft，每个 epoch 都留）；挑出 epoch 后 --start 写每个种子的 RL 链（<tr>_s<种子>）
  tr: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/m3_dn   # 每条链在自己的文件夹里另有两个题集的复制
  rl_name: v10_rl_m3_dn     # 加 _sft / _s1 / _s2；RL 运行 m3dns1s0、m3dns1d、m3dns2s0、m3dns2d
  sft_dir: /mnt/umm/users/yinbaiqiao/models_runs/sft_v10_newformat_20261024
  sft_groups: {m3dn: sft_trajectories.jsonl}   # SFT 的结果名 sft_m3dn_e<k>
  sft_lf_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/sft/D_noP0   # data.lf_dir 的复制（数据文件逐字节相同，train.yaml 只改了两条路径）
  needs_chain_support:
    sft_lf_dirs: {m3dn: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-matrix/exps/matrix_v3/sft/D_noP0}
    diagnostics_after_eval: true

estimate: {sft: 8 卡约 4 小时（10 个 epoch，18,150 条，约 30 卡时）, rl: 4 个，每个 1 + 8 卡约 5.5 小时, evaluate: 4 个 RL 各 6 个检查点 × 2 个题集, 合计: 约 250 卡时（用户 2026-11-03 的估计）}
