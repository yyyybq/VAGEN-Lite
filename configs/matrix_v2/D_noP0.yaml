# 矩阵第二版 D_noP0 组（备选，用户 2026-10-19，只写配置、不排期）：P1 + P2、不含 P0，其余和 D 完全一致；P1、P2 的训练行和 D 逐条相同（mixture 配置 draw_as: D）。说明见 configs/matrix_v2/README.md。
# RL 标准名是变量：{rl_package}（configs/matrix_v2/vars.yaml，现在 v10_p1）和 {pkg}（它去掉 v10_ 的短名，用在 RL 的目录名里）；
# 训练链的 plan 用 python -m data_gen.sft_mixture.matrix_plan --group <组> 生成（填变量、核对标准）。
# 注意：v10_p1 / v10_p2 是 RL 修正包（rl_standards.json 里的优化设置）的名字，和数据池 P1（转移题）/ P2（动作轨迹）无关。
# 只写配置。train_chain_plan 是训练链 plan.json 能读的字段；needs_chain_support 是它现在读不了的（CHANGES.md 第 5 节）。
# 2026-10-19 按第十二轮的决定更新：RL 成对（S0 和 D）、SFT 10 个 epoch、v2 评测集。
group: D_noP0
description: 转移题 + 动作轨迹，不含 P0，两种样本分开、同一次训练；之后 RL（备选，不排期）
status: 备选，不排期（用户 2026-10-19）
output_format: action_only

data:
  mixture_config: data_gen/sft_mixture/configs/mixture_matrix_v2_20261018.yaml
  recipe: D_noP0
  lf_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/sft_mixture_matrix_v2_20261018/D_noP0
  train_rows: {P0: 0, P1: 9802, P2: 9802}     # 和 D 的 P1、P2 逐条相同
  val_rows: {P0: 20, P1: 300, P2: 300}         # 五组相同；每个池单独算验证损失

sft:
  base_model: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r11_20261016/inputs/base_7b
  epochs: 10   # 第十二轮第 6 条：SFT 保持 10 个 epoch、按验证集挑
  cards: 8
  recipe: data/lf_dir 下的 train.yaml（第十一轮正式 SFT 的设置，10 个 epoch，每个 epoch 存一次，eval_on_each_dataset）
  select: 每个 epoch 在 val（eval_val_v2）上评测（不采样），挑成功率最高的，打平取更早的

rl:   # 第十二轮第 2 条：每次 RL 实验成对跑，S0 和 D 同一个起点、同一批题、同一个种子、同样的更新次数
  start: SFT 挑出的检查点
  pair:
    "{pkg}s0": "{rl_package}_S0"   # data_gen/interiorgs_v10/configs/rl_standards.json：修正包 + 稀疏奖励
    "{pkg}d": "{rl_package}_D"     # 修正包 + 密集奖励
  seed: 20261019
  tasks: train 后备题（task_pool reserve），去掉深度核对标出的题
  updates: 300
  output_format: action_only
  guards: {kl_max: 0.2, invalid_max: 0.05, invalid_window: 10, success_drop: 0.10, drop_window: 50, start_updates: 5}
  startup: {retries: 2, stall_minutes: 40}   # 第十二轮第 5 条：H800 启动失败自动重交

eval:
  sets:
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r12_20261019/eval_val_v2    # 413 道 = val400 + 15 道遮挡题
    test: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r12_20261019/eval_test_v2  # 292 道 = 279 + 13 道遮挡题
  every: 50
  diagnostics:
    failure_breakdown: python -m eval.diagnostics.failure_breakdown --eval <set> --out <TR>/diag/failure_<set>
    qa_probe: python -m eval.diagnostics.sco_probe --probe /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/transition_qa_20261019b/p1_probe.jsonl --from-eval <val> --names <SFT 各 epoch 和两个 RL 的各检查点>
    baseline: docs/transition_qa/DIAG_BASELINE.md（失败拆解的基线用的是第十一轮的 val400 / test，v2 多了 28 道遮挡题）

train_chain_plan:   # 照第十二轮的 plan（interiorgs_v10_train_r12a_20261019）写
  tr: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_m2_d_nop0
  sft_dir: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r11_20261016/sft
  commit: TBD  # main 合并 transition-qa 之后的提交
  model: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r11_20261016/inputs/base_7b
  gs_root: /mnt/umm/users/yinbaiqiao/InteriorGS_ply
  scenes_root: /mnt/umm/users/yinbaiqiao/InteriorGS_meta
  keep_text: true
  sft_epochs: 10
  sft_groups: {mix: sft_trajectories.jsonl}   # 组名决定 TR/lf_mix；轨迹文件给 rl-config 查 RL 题和 SFT 题不重合
  eval_sets:
    val: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r12_20261019/eval_val_v2
    test: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r12_20261019/eval_test_v2
  select_by: val
  max_eval_jobs: 10
  pool: h800
  endpoint: 300
  rl_name: v10_rl_m2_d_nop0
  rl:
    standard: "{rl_package}_S0"
    seed: 20261019
    task_pool: reserve
    rows: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r11_20261016/rl_rows/rows.jsonl
    exclude: /mnt/umm/users/yinbaiqiao/VAGEN-Lite/exps/vagen_active_spatial/interiorgs_v10_r10_20261015/depth_check/depth_check_summary.json
    guards: {kl_max: 0.2, invalid_max: 0.05, invalid_window: 10, success_drop: 0.10, drop_window: 50, start_updates: 5}
    startup: {retries: 2, stall_minutes: 40}
  rl_runs: {"{pkg}s0": {}, "{pkg}d": {rl: {standard: "{rl_package}_D"}}}
  eval: {every: 50, options: []}

needs_chain_support:
  sft_lf_dirs: {mix: /mnt/umm/users/yinbaiqiao/VAGEN-Lite-data/exps/sft_mixture_matrix_v2_20261018/D_noP0}
  # SFT 用这个已经建好的 LLaMA-Factory 目录（混合配方），跳过 sft-records 和 prepare_active_spatial_sft.py
  diagnostics_after_eval: true   # 评测后跑失败拆解和 P1 探针

manual_steps:   # 不改训练链时
  - ln -s <data.lf_dir> <tr>/lf_mix    # 训练链的 SFT、按 epoch 评测、挑模型都按 TR/lf_<组名> 找
  - 在 <tr>/progress.json 里把 render、sft_data 标成 done（note 写"SFT 数据由 data_gen/sft_mixture 构建"），再 train_chain run
  - 评测结束后手工跑 eval.diagnostics 的两个诊断

estimate: {sft: 8 卡约 6 小时（10 个 epoch）, sft_eval: 20 个单卡任务约 1 小时, rl: 两个各 1 + 8 卡约 11.5 小时（可同时跑）, evaluate: 两个 RL 各 6 个检查点 × 2 个题集}
